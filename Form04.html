<html>
	<head>
		<title> Mi Página con Formularios </title>
	</head>

	<body bgcolor="teal">
		Mi Página con Formularios
		
		<form name="frmDatos" method="post" enctype="multipart/form-data">
			<br>
			<font size="9">
			Introduzca nombre, contraseña y texto:
			<br>
			Nombre 
			<br>
			<INPUT name="nombre" type="text" size="100" maxlength="100">
			<br>
			contraseña 
			<br>
			<INPUT name="contraseña" type="password" size="100" maxlength="100">
			<br>
			texto 
			<br>
			<textarea name="textarea" cols="50" rows="10">
			</textarea>
			<br>
		</form>
		
		
		
	</body>
</html>
