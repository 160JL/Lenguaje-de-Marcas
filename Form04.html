<html>
	<head>
		<title> Mi Página con Formularios </title>
	</head>

	<body bgcolor="teal">
		Mi Página con Formularios
		
		<form name="frmDatos" method="post" enctype="multipart/form-data">
			Seleccione uno o varios destinos (Presione Ctrl) <br>
			<select name="destino" id="destino" multiple>
				<option value="cancun">
					Cancún
				</option>
				<option value="iGalapago">
					Islas Galápago
				</option>
				<option value="sidney">
					Sidney
				</option>
				<option value="nYork">
					New York
				</option>
				<option value="pMoreno">
					Perito Moreno
				</option>
				<option value="fiordos">
					Fiordos
				</option>
			</select> <br>
			<input name="botonEnviar" type="submit" id="botonEnviar" value="Enviar">
		</form>
		
		
		
	</body>
</html>
