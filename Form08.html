<html>
	<head>
		<title> Mi Página con Formularios </title>
	</head>

	<body bgcolor="teal">
		Mi Página con Formularios
		
		<form name="frmDatos" method="post" enctype="multipart/form-data">
		<fieldset>
			<br>
			<legend>Seleccione tipo y cantidad de pizza</legend>
			pizza:
			<SELECT name= "tipo" id="tipo">
			<OPTION value="1"> Mozzarella </OPTION>
			<OPTION value="2"> Jamon y queso </OPTION>
			<OPTION value="3"> Napolitana </OPTION>
			</SELECT>
			cantidad:
			<SELECT name= "cantidad" id="cantidad">
			<OPTION value="1"> 0 </OPTION>
			<OPTION value="2"> 1 </OPTION>
			<OPTION value="3"> 2 </OPTION>
			<OPTION value="3"> 5 </OPTION>
			<OPTION value="3"> 10 </OPTION>
			</SELECT>
		</fieldset>
			<br>
		<fieldset>
			<legend> Datos </legend>
				<br>
				Nombre:
				<INPUT name="Nombre" type="text" id="Nombre">
				<BR>
				Direccion:
				<INPUT name="Direccion" type="text" id="Direccion">
				<BR>
				Telefono:
				<INPUT name="Telefono" type="text" id="Telefono">
				<BR>
		</fieldset>
			
		</SELECT>
	</body>
</html>
