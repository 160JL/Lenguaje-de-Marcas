<html>
	<head>
		<title> Mi Página con Formularios </title>

	<body bgcolor="teal">
		Mi Página con Formularios
		
		<form name="frmDatos" method="post" enctype="multipart/form-data">

			Nombre:
			<INPUT name="nombre" type="text" id="nombre">
			<BR>
			Marca:
			<INPUT name="marca" type="text" id="marca">
			<BR>
			Modelo:
			<INPUT name="modelo" type="text" id="modelo">
			<BR>
			color:
			<INPUT name="color" type="text" id="color">
			<BR>
			<h3> Combustible </h3>
			<SELECT name= "combustible" id="combustible">
			<OPTION value="0"> diesel </OPTION>
			<OPTION value="1"> gasolina </OPTION>
			<OPTION value="2"> híbrido </OPTION>
			<OPTION value="3"> eléctrico </OPTION>
			</SELECT>
			
			<h2 size="20"> Datos mascota </h2>
			Especie:
			<INPUT name="especie" type="text" id="especie">
			<BR>
			Tipo:
			<INPUT name="tipo" type="text" id="tipo">
			<BR>
			Raza:
			<INPUT name="raza" type="text" id="raza">
			<BR>
			Nª Patas:
			<INPUT name="patas" type="text" id="patas">
			<BR>
			Color:
			<INPUT name="color" type="text" id="color" >
			<BR>
		</SELECT>
	</body>
</html>
